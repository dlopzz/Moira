name: moira-prod

services:
  pgsql:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - moira_pgsql_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME}", "-d", "${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - moira_internal

  api:
    build:
      context: ./moira-api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./moira-api/.env
    depends_on:
      pgsql:
        condition: service_healthy
    volumes:
      - moira_storage:/var/www/html/storage/app/public
    networks:
      - moira_internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.moira-api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.moira-api.entrypoints=websecure
      - traefik.http.routers.moira-api.tls.certresolver=letsencrypt
      - traefik.http.services.moira-api.loadbalancer.server.port=8080

  queue:
    build:
      context: ./moira-api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./moira-api/.env
    entrypoint: ["/usr/local/bin/entrypoint-queue.sh"]
    # The base image's built-in healthcheck expects nginx+php-fpm, which this
    # container doesn't run (it's just `artisan queue:work`) — disable it.
    healthcheck:
      disable: true
    depends_on:
      pgsql:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - moira_internal

  web:
    build:
      context: ./moira-web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
    restart: unless-stopped
    environment:
      # Gate de QA (ver src/proxy.ts): si tiene valor, todo el sitio pide login
      # antes de mostrar cualquier página. Dejar vacío/sin definir para que el
      # sitio quede público (lanzamiento).
      QA_AUTH_SECRET: ${QA_AUTH_SECRET:-}
    networks:
      - moira_internal
    healthcheck:
      # Sin esto Traefik empieza a rutear apenas arranca el contenedor, antes de
      # que Next.js acepte conexiones, y el visitante ve un error crudo.
      # Alcanza con que el server responda: no importa si devuelve 200, 307 al
      # gate de QA o 404. Se usa node y no wget porque el wget de BusyBox falla
      # con cualquier respuesta que no sea 200.
      # Se prueba loopback y la IP del contenedor: si Next quedara escuchando
      # solo en eth0 (HOSTNAME), el chequeo igual pasa.
      test: ["CMD", "node", "-e", "const h=require('http');const t=(u,n)=>h.get(u,()=>process.exit(0)).on('error',n);t('http://127.0.0.1:3000/',()=>t('http://'+process.env.HOSTNAME+':3000/',()=>process.exit(1)))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.moira-web.rule=Host(`${WEB_DOMAIN}`) || Host(`${WEB_DOMAIN_ALT}`) || Host(`www.${WEB_DOMAIN_ALT}`)
      # Prioridad alta: mientras el sitio esté arriba, este router le gana al de
      # mantenimiento, que matchea los mismos dominios.
      - traefik.http.routers.moira-web.priority=100
      - traefik.http.routers.moira-web.entrypoints=websecure
      - traefik.http.routers.moira-web.tls.certresolver=letsencrypt
      - traefik.http.services.moira-web.loadbalancer.server.port=3000
      # Mientras se reconstruye/reinicia el contenedor, Traefik sirve la página de
      # mantenimiento del servicio "maintenance" en vez de un 502/503/504 crudo.
      - traefik.http.middlewares.moira-web-maintenance.errors.status=502-504
      - traefik.http.middlewares.moira-web-maintenance.errors.service=moira-maintenance
      - traefik.http.middlewares.moira-web-maintenance.errors.query=/index.html
      - traefik.http.routers.moira-web.middlewares=moira-web-maintenance

  maintenance:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./deploy/maintenance:/usr/share/nginx/html:ro
    networks:
      - moira_internal
    labels:
      - traefik.enable=true
      - traefik.http.services.moira-maintenance.loadbalancer.server.port=80
      # Router de respaldo, siempre presente y con prioridad baja. Cubre el hueco
      # del deploy: mientras el contenedor "web" se recrea, sus labels
      # desaparecen del socket de Docker y Traefik se queda sin regla para el
      # dominio, devolviendo su 404 por defecto. Ese 404 no lo agarra el
      # middleware de errores, porque solo cubre 502-504 y los emite el servicio
      # que en ese momento ya no existe. Con este router el dominio siempre
      # matchea algo, así que el visitante ve la página de mantenimiento.
      - traefik.http.routers.moira-maintenance.rule=Host(`${WEB_DOMAIN}`) || Host(`${WEB_DOMAIN_ALT}`) || Host(`www.${WEB_DOMAIN_ALT}`)
      - traefik.http.routers.moira-maintenance.priority=1
      - traefik.http.routers.moira-maintenance.entrypoints=websecure
      - traefik.http.routers.moira-maintenance.tls.certresolver=letsencrypt
      - traefik.http.routers.moira-maintenance.service=moira-maintenance

networks:
  moira_internal:
    driver: bridge

volumes:
  moira_pgsql_data:
  moira_storage:
